    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ngraph.forcelayout demo</title>
    <!-- <script src="ngraph.forcelayout2d.js"></script> -->
    <style>
      * {
        box-sizing: border-box;
      }
body {
  font-family: 'Avenir', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: #EEE;
  margin: 0;
  background: rgb(12, 41, 82);
  overflow: hidden;
}
canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
}
#no-webgl {
  display: none;
  position: absolute;
  width: 100%;
  height: 100%;
  padding: 16px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 22px;
}
#no-webgl p {
  margin: 8px 0;
  max-width: 560px;
}
#no-webgl .hint {
  font-size: 16px;
  color: #AAA;
}
.no-webgl #no-webgl {
  display: flex;
}
.no-webgl #app, .no-webgl canvas {
  display: none;
}
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but puller doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <canvas id='cnv'></canvas>
    <div id="app"></div>
    <div id='no-webgl'>
      <p>This demo draws graphs with WebGL, which is not available in this browser.</p>
      <p class='hint'>Turning on hardware acceleration in the browser's settings usually brings it back.</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
